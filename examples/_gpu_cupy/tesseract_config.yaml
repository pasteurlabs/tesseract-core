name: "gpu-cupy"
version: "0.1.0"
description: "GPU Tesseract returning CuPy device memory, for CUDA IPC end-to-end tests."

build_config:
  # The default Debian base image is enough: libcudart comes from the CuPy CUDA
  # wheel (the runtime loader prefers the pip-wheel copy), and the GPU driver is
  # injected by the container runtime at `docker run --gpus all`.
  target_platform: "native"
