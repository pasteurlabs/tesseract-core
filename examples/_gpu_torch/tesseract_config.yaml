name: "gpu-torch"
version: "0.1.0"
description: "GPU Tesseract returning PyTorch device memory, for CUDA IPC end-to-end tests."

build_config:
  # The default Debian base image is enough: libcudart comes from the PyTorch
  # CUDA wheel (the runtime loader prefers the pip-wheel copy), and the GPU driver
  # is injected by the container runtime at `docker run --gpus all`.
  target_platform: "native"
