name: Run test suite

# Pull requests run a fast tier of jobs, and the merge queue runs the full
# matrix. The commit the queue tests is the one that lands on main, so there is
# no separate run on push to main. .github/scripts/plan_ci.py decides which
# jobs run.

on:
  pull_request:

  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TESSERACT_TEST_KEEP_IMAGES: "1"

  # The Python versions to test with. NOTE: If bumping the oldest version, also
  # update `requires-python` in pyproject.toml, ruff's `target-version`, and the
  # other workflows.
  PYTHON_OLDEST: "3.10"
  PYTHON_LATEST: "3.15"
  # For jobs that test a single version, such as the end-to-end test host
  PYTHON_DEFAULT: "3.14"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    outputs:
      full: ${{ steps.plan.outputs.full }}
      run-demos: ${{ steps.plan.outputs.run-demos }}
      run-gpu: ${{ steps.plan.outputs.run-gpu }}
      base-matrix: ${{ steps.plan.outputs.base-matrix }}
      e2e-matrix: ${{ steps.plan.outputs.e2e-matrix }}
      pip-install-matrix: ${{ steps.plan.outputs.pip-install-matrix }}
      demos: ${{ steps.plan.outputs.demos }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      # Labels are looked up live rather than read from the event payload, so
      # that adding `ci:full` and re-running the workflow picks it up.
      - name: Get labels and changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"
          # If the files can't be listed, plan_ci.py runs the full matrix.
          if ! gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' \
            > "$RUNNER_TEMP/changed_files.txt"; then
            echo "::warning::Could not list the changed files, so the full matrix runs."
            rm -f "$RUNNER_TEMP/changed_files.txt"
          fi

      # The path globs below decide which optional jobs a pull request runs.
      # They match with fnmatch, where `*` also matches `/`.
      - name: Plan jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # Changes to any of these run the full matrix on the pull request.
          FULL_PATHS: |
            pyproject.toml
            production.uv.lock
            requirements.txt
            .github/workflows/run_tests.yml
            .github/scripts/plan_ci.py
          DEMO_PATHS: |
            demo/**
          # The GPU-specific code paths. Broader changes that could still break
          # GPU serving are caught by the merge queue.
          GPU_PATHS: |
            tesseract_core/runtime/cuda/**
            tesseract_core/runtime/device_transport.py
            tesseract_core/runtime/array_encoding.py
            tests/test_cuda_ipc*
            tests/endtoend_tests/test_serving_gpu.py
            examples/_gpu_*/**
        run: |
          args=(
            --event "$EVENT"
            --python-oldest "$PYTHON_OLDEST"
            --python-latest "$PYTHON_LATEST"
            --python-default "$PYTHON_DEFAULT"
            --full-paths "$FULL_PATHS"
            --demo-paths "$DEMO_PATHS"
            --gpu-paths "$GPU_PATHS"
          )
          if [ "$EVENT" == "pull_request" ]; then
            args+=(--labels "$RUNNER_TEMP/labels.txt" --changed-files "$RUNNER_TEMP/changed_files.txt")
          fi
          python3 .github/scripts/plan_ci.py plan "${args[@]}"

  tests-base:
    needs: [plan]

    name: tests-base (${{ matrix.label }})

    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.base-matrix) }}

      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: |
          cp production.uv.lock uv.lock
          if [ "${{ matrix.runtime-deps }}" == "oldest" ]; then
            # replace >= with == in runtime deps section of pyproject.toml to install oldest runtime deps
            sed -i '/^runtime = \[$/,/^]$/s/>=/==/g' ./pyproject.toml
            # re-resolve (unfrozen) so the whole env is consistent against the oldest runtime pins
            uv sync --python ${{ matrix.python-version }} --extra dev
          else
            uv sync --python ${{ matrix.python-version }} --extra dev --frozen
          fi

      # Typeguard breaks coverage's branch mapping (gh#691), so one job runs the
      # suite with typeguard (enabled via addopts in pyproject.toml) and without
      # coverage. This is where type annotations are validated in CI.
      - name: Run test suite with typeguard
        if: matrix.typeguard
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          uv run --no-sync pytest \
            -v \
            --skip-endtoend \
            --timeout=300

      - name: Run test suite
        if: ${{ !matrix.typeguard }}
        env:
          # Tests build environments in temp dirs. Keep those on the uv cache's
          # drive (RUNNER_TEMP) so uv hardlinks rather than copies on Windows.
          # Python's tempfile checks TMPDIR first on every OS.
          TMPDIR: ${{ runner.temp }}
        run: |
          # No typeguard here: it breaks coverage's branch mapping (gh#691).
          uv run --no-sync pytest \
            -o addopts="--durations=10" \
            -v \
            --skip-endtoend \
            --timeout=300 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_core \
            --cov-branch

      - name: Upload coverage reports to Codecov
        if: ${{ !matrix.typeguard }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-core
          files: coverage*.xml
          flags: base-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.runtime-deps }}
          fail_ci_if_error: true

  tests-e2e:
    needs: [plan]

    name: tests-e2e (${{ matrix.label }})

    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.e2e-matrix) }}

      fail-fast: false

    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      # Use Conda to install Python (setup-python action doesn't support ARM).
      # This also puts conda on the PATH for the conda example's from_source test.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: defaults

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install package
        run: |
          uv sync --extra dev --frozen

      - name: Set up Podman
        if: matrix.docker-engine == 'podman'
        run: |
          systemctl start --user podman.socket
          systemctl status --user podman.socket

          podman --version

          export DOCKER_HOST=unix:///run/user/1001/podman/podman.sock
          echo "DOCKER_HOST=${DOCKER_HOST}" >> $GITHUB_ENV
          echo "TESSERACT_DOCKER_EXECUTABLE=podman" >> $GITHUB_ENV

      # The example tests are split into shards (see plan_ci.py). Build this
      # shard's examples here so their layers are cached before the tests run.
      # test_unit_tesseract_endtoend builds the same examples inside the timed
      # test body, and a cold build (pulling the base image plus installing the
      # runtime) can otherwise exceed the per-test --timeout=300. Warming the
      # layer cache outside pytest's timeout leaves the in-test builds as cache
      # hits. The "base" jobs run no example builds, so they skip this.
      - name: Pre-build examples (warm layer cache)
        if: matrix.examples != ''
        env:
          EXAMPLES: ${{ matrix.examples }}
        run: |
          for example in $EXAMPLES; do
            uv run --no-sync tesseract build "examples/$example"
          done

      - name: Run test suite
        env:
          EXAMPLES: ${{ matrix.examples }}
        run: |
          # No typeguard here: it breaks coverage's branch mapping (gh#691).
          if [ -z "$EXAMPLES" ]; then
            uv run --no-sync pytest \
              -o addopts="--durations=10" \
              --always-run-endtoend \
              --timeout=300 \
              --cov-branch \
              --cov-report=term-missing:skip-covered \
              --cov-report=xml:coverage.xml \
              --cov=tesseract_core \
              tests/endtoend_tests \
              -k "not test_examples"
          else
            # Select this shard's examples, e.g. "[helloworld] or [vectoradd]"
            selection=$(printf '[%s] or ' $EXAMPLES)
            uv run --no-sync pytest \
              -o addopts="--durations=10" \
              --always-run-endtoend \
              --timeout=300 \
              --cov-branch \
              --cov-report=term-missing:skip-covered \
              --cov-report=xml:coverage.xml \
              --cov=tesseract_core \
              tests/endtoend_tests/test_examples.py \
              -k "${selection% or }"
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-core
          files: coverage*.xml
          flags: e2e-${{ matrix.name }}-${{ matrix.arch }}-${{ matrix.docker-engine }}
          fail_ci_if_error: true

  tests-demos:
    needs: [plan]

    if: needs.plan.outputs.run-demos == 'true'

    strategy:
      matrix:
        os: [ubuntu-latest]
        demo: ${{ fromJson(needs.plan.outputs.demos) }}

      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Test with the oldest supported Python version only (for slow tests)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_OLDEST }}

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install dev requirements
        run: |
          uv sync --extra dev --frozen

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libosmesa6

      - name: Install demo requirements
        working-directory: demo/${{matrix.demo}}
        run: |
          uv pip install -r requirements.txt

      - name: Run demos
        working-directory: demo/${{matrix.demo}}
        env:
          DISPLAY: ":99"
          PYVISTA_OFF_SCREEN: "true"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          uv pip install jupyter
          uv run --no-sync jupyter nbconvert --to notebook --execute demo.ipynb

  tests-gpu:
    needs: [plan]

    if: needs.plan.outputs.run-gpu == 'true'

    runs-on: tesseract-ci-gpu
    timeout-minutes: 60

    # Exercise both CUDA major versions so the ctypes loader's version fallbacks
    # (libcudart.so.12/.13) and the encode/decode path are covered against each.
    # The array frameworks are pinned to a matching CUDA build (cupy-cuda1Nx,
    # torch's per-CUDA wheel index, jax[cuda1N]) so the libcudart the runtime
    # actually binds to differs between entries.
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - major: "12"
            base_image: "nvidia/cuda:12.8.1-base-ubuntu24.04"
            torch_index: "cu126"
          - major: "13"
            base_image: "nvidia/cuda:13.3.1-base-ubuntu24.04"
            torch_index: "cu130"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Show GPU info
        run: |
          nvidia-smi
          # Confirm Docker can see the GPU via the NVIDIA container runtime; the
          # end-to-end tests build and serve a GPU Tesseract, so a broken
          # runtime must fail loudly here rather than silently skip.
          docker info
          docker run --rm --gpus all ${{ matrix.cuda.base_image }} nvidia-smi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: |
          cp production.uv.lock uv.lock
          uv sync --python "$PYTHON_DEFAULT" --extra dev --frozen

      # cupy/torch/jax with CUDA support are not declared dependencies (they are
      # only needed to *produce* GPU arrays in the tests); install builds for the
      # matrix CUDA major version into the same environment here. The runtime
      # library itself only needs libcudart, which cupy's wheel bundles.
      #
      # torch must come from its per-CUDA wheel index: plain "torch" from PyPI
      # always resolves to the newest CUDA build regardless of the requested
      # major, so it is installed separately against the matching cuNNN index.
      - name: Install GPU array frameworks
        run: |
          uv pip install \
            --index-url "https://download.pytorch.org/whl/${{ matrix.cuda.torch_index }}" \
            "torch"
          uv pip install \
            "cupy-cuda${{ matrix.cuda.major }}x" \
            "jax[cuda${{ matrix.cuda.major }}]"

      # The nixl GPU transport tests skip without NIXL. Install the build for
      # the matrix's CUDA major, whose wheel bundles UCX.
      - name: Install NIXL
        run: |
          uv pip install "nixl-cu${{ matrix.cuda.major }}"

      - name: Show installed CUDA frameworks
        run: |
          uv run --no-sync python -c "import cupy; print('cupy', cupy.__version__, 'runtime', cupy.cuda.runtime.runtimeGetVersion(), 'devices', cupy.cuda.runtime.getDeviceCount())"
          uv run --no-sync python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda, torch.cuda.is_available())"
          uv run --no-sync python -c "import jax; print('jax', jax.__version__, 'devices', jax.devices())"
          uv run --no-sync python -c "from nixl_cu${{ matrix.cuda.major }}._api import nixl_agent, nixl_agent_config; nixl_agent('ci', nixl_agent_config(backends=['UCX'])); print('nixl agent OK')"

      # Build the GPU examples here so their layers are cached before the tests
      # run. The test_serving_gpu fixture builds the same examples with the same
      # requirements override, and installing the CUDA framework wheels can
      # otherwise exceed the per-test --timeout=300 from inside the fixture.
      # Warming the layer cache outside pytest's timeout leaves the fixture builds
      # as cache hits, so the override must match exactly.
      #
      # The examples build on the default Debian base image; the CUDA runtime
      # comes from the framework wheels, which the runtime loader prefers over any
      # system copy. The wheel's CUDA major is therefore what libcudart resolves
      # to, so the 13.x leg swaps in tesseract_requirements_cuda13.txt to exercise
      # libcudart.so.13.
      - name: Pre-build GPU examples (warm layer cache)
        run: |
          # jax runs on the CUDA 13 leg only (its cuda12 plugin won't register
          # under the CI's CUDA 13 driver); cupy/torch cover the .so.12 path.
          examples="_gpu_cupy _gpu_torch"
          reqs_override=""
          if [ "${{ matrix.cuda.major }}" != "12" ]; then
            reqs_override="--config-override build_config.requirements.requirements_file=tesseract_requirements_cuda${{ matrix.cuda.major }}.txt"
            examples="$examples _gpu_jax"
          fi
          for example in $examples; do
            uv run --no-sync tesseract build "examples/$example" $reqs_override
          done

      - name: Run GPU test suite
        env:
          TESSERACT_TEST_CUDA_MAJOR: ${{ matrix.cuda.major }}
        run: |
          # No typeguard here: it breaks coverage's branch mapping (gh#691).
          uv run --no-sync pytest \
            -o addopts="--durations=10" \
            -v \
            -m gpu \
            -rs \
            --always-run-endtoend \
            --timeout=300 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_core \
            --cov-branch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-core
          files: coverage*.xml
          flags: gpu-cuda${{ matrix.cuda.major }}
          fail_ci_if_error: true

  tests-pip-install:
    needs: [plan]

    if: needs.plan.outputs.full == 'true'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.pip-install-matrix) }}

      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          if [ "${{ matrix.dependencies }}" = "pinned" ]; then
            echo "Using pinned dependencies"
            pip install -r requirements.txt
            pip install --no-deps .
          else
            echo "Using latest dependencies"
            pip install .
          fi

      - name: Ensure CLI is available
        run: |
          tesseract --help

      - name: Ensure basic workflow works
        # Docker is only available on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          tesseract build examples/helloworld
          tesseract run helloworld apply '{"inputs": {"name": "GitHub Actions"}}'

  all-ok:
    if: always()
    needs:
      [plan, tests-base, tests-e2e, tests-demos, tests-gpu, tests-pip-install]

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Check for errors
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/plan_ci.py check --needs "$NEEDS"
