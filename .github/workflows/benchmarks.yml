name: Benchmarks

on:
  pull_request:
    paths:
      - "tesseract_core/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"

  push:
    branches:
      - main

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # PRs run the suite this many times per side (see "Run benchmarks").
      # Pushes to main run it once, for the trend record.
      PASSES: ${{ github.event_name == 'pull_request' && 3 || 1 }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install package
        run: uv sync --extra dev --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Check out baseline branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: baseline

      - name: Install package (baseline)
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: |
          cp production.uv.lock uv.lock 2>/dev/null || true
          uv sync --extra dev --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use PR benchmark scripts for baseline
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: |
          cp -r ../benchmarks/* benchmarks/

      # Each side runs $PASSES times, each pass in a fresh process, in the order
      # B C C B B C so that drift over the job affects both sides alike.
      # compare_benchmarks.py explains how the passes are compared.
      - name: Run benchmarks
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(-m "not slow")
          has_baseline=$([ "$EVENT_NAME" = "pull_request" ] && echo true || echo false)

          for i in $(seq "$PASSES"); do
            if [ $((i % 2)) = 1 ]; then order="baseline current"; else order="current baseline"; fi
            for side in $order; do
              echo "::group::Pass $i ($side)"
              if [ "$side" = "current" ]; then
                uv run --no-sync pytest benchmarks/ "${args[@]}" \
                  --benchmark-json "current_benchmarks_$i.json"
              elif [ "$has_baseline" = "true" ]; then
                if ! (cd baseline && uv run --no-sync pytest benchmarks/ "${args[@]}" \
                    --benchmark-json "../baseline_benchmarks_$i.json"); then
                  echo "::warning::Baseline benchmark run failed, skipping comparison"
                  has_baseline=false
                  rm -f baseline_benchmarks_*.json
                fi
              fi
              echo "::endgroup::"
            done
          done

          echo "has_baseline=$has_baseline" >> "$GITHUB_OUTPUT"

      # Secrets are withheld from `pull_request` runs on fork PRs, so the comment
      # is posted by the privileged `Benchmark Report` workflow instead.
      - name: Generate comparison report
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_BASELINE: ${{ steps.run.outputs.has_baseline }}
        run: |
          baseline_args=()
          if [ "$HAS_BASELINE" = "true" ]; then
            baseline_args=(--baseline baseline_benchmarks_*.json)
          fi

          python benchmarks/compare_benchmarks.py \
            "${baseline_args[@]}" \
            --current current_benchmarks_*.json \
            --pr-number "$PR_NUMBER" \
            --output benchmark_report.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            current_benchmarks_*.json
            baseline_benchmarks_*.json
            benchmark_report.md
          if-no-files-found: ignore
          retention-days: 30
