name: Podman build diagnostic

# Manual-only diagnostic to compare docker vs podman build performance step by
# step. Not part of PR validation. Produced during investigation of why the
# podman e2e job runs ~2x the docker e2e job wall time.

on:
  # pull_request:

  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.14"
          channels: defaults

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tesseract-core
        run: |
          cp production.uv.lock uv.lock
          uv sync --extra dev --frozen

      - name: Install moreutils (for ts)
        run: sudo apt-get install -y -qq moreutils

      - name: Set up Podman
        run: |
          systemctl start --user podman.socket
          systemctl status --user podman.socket
          podman --version
          podman info --format 'storage: {{.Store.GraphDriverName}} (native overlay diff: {{index .Store.GraphStatus "Native Overlay Diff"}}) / runtime: {{.Host.OCIRuntime.Name}} / network: {{.Host.NetworkBackend}}'

      - name: Set up Docker info
        run: |
          docker --version
          docker info --format 'storage: {{.Driver}} / runtime: {{.DefaultRuntime}}'

      - name: Generate build context
        run: |
          # Init a sample tesseract, then produce the rendered Dockerfile +
          # context without actually building. Both engines then build this
          # exact context so differences are engine-level, not SDK-level.
          mkdir -p /tmp/diag_src
          uv run --no-sync tesseract init --target-dir /tmp/diag_src --name diag
          # --generate-only prints the build-context path as its last line of
          # output; capture it (stdout + stderr merged for robustness).
          BUILD_DIR=$(uv run --no-sync tesseract build --generate-only /tmp/diag_src 2>&1 | tail -n 1 | xargs)
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "Build context: ${BUILD_DIR}"
          ls -la "${BUILD_DIR}"

      - name: Run docker builds (3x, cold cache)
        run: |
          mkdir -p /tmp/diag_logs
          for i in 1 2 3; do
            echo "--- docker run $i ---"
            docker system prune -af --volumes >/dev/null 2>&1 || true
            start=$(date +%s.%N)
            docker buildx build \
              --no-cache \
              --progress=plain \
              --file "${BUILD_DIR}/Dockerfile" \
              --tag "diag:docker-${i}" \
              "${BUILD_DIR}" \
              2>&1 | ts '%.s' > "/tmp/diag_logs/docker_${i}.log" || echo "docker build $i FAILED"
            end=$(date +%s.%N)
            dur=$(echo "$end - $start" | bc)
            echo "docker run ${i}: ${dur}s wall"
          done

      - name: Run podman builds (3x, cold cache)
        env:
          DOCKER_HOST: unix:///run/user/1001/podman/podman.sock
        run: |
          for i in 1 2 3; do
            echo "--- podman run $i ---"
            podman system reset -f >/dev/null 2>&1 || true
            # Restart socket after reset.
            systemctl start --user podman.socket
            start=$(date +%s.%N)
            # --jobs=2 asks buildah to run both stages (build_stage + run_stage)
            # concurrently, which is the one thing BuildKit does and buildah
            # does not by default.
            # Run 1 also gets --log-level=debug so we can see what buildah is
            # actually doing during the COPY --from=build_stage step.
            debug_flag=""
            if [ "$i" = "1" ]; then
              debug_flag="--log-level=debug"
            fi
            podman $debug_flag buildx build \
              --jobs=2 \
              --no-cache \
              --progress=plain \
              --file "${BUILD_DIR}/Dockerfile" \
              --tag "diag:podman-${i}" \
              "${BUILD_DIR}" \
              2>&1 | ts '%.s' > "/tmp/diag_logs/podman_${i}.log" || echo "podman build $i FAILED"
            end=$(date +%s.%N)
            dur=$(echo "$end - $start" | bc)
            echo "podman run ${i}: ${dur}s wall"
          done

      - name: Measure image sizes and /python-env data volume
        env:
          DOCKER_HOST: unix:///run/user/1001/podman/podman.sock
        run: |
          # How much actual data is in /python-env (the thing the COPY
          # --from=build_stage step moves between stages)? Overridden entrypoint
          # so `du` can run inside the image.
          echo "--- docker image sizes (bytes) ---"
          for i in 1 2 3; do
            sz=$(docker image inspect "diag:docker-${i}" --format '{{.Size}}' 2>/dev/null || echo "n/a")
            echo "diag:docker-${i}  total=${sz}"
          done

          echo "--- podman image sizes (bytes) ---"
          for i in 1 2 3; do
            sz=$(podman image inspect "diag:podman-${i}" --format '{{.Size}}' 2>/dev/null || echo "n/a")
            echo "diag:podman-${i}  total=${sz}"
          done

          echo "--- /python-env size inside the image ---"
          echo "(from docker run #1)"
          docker run --rm --entrypoint='' "diag:docker-1" du -sh /python-env 2>&1 || echo "docker inspect failed"
          echo "(from podman run #1)"
          podman run --rm --entrypoint='' "diag:podman-1" du -sh /python-env 2>&1 || echo "podman inspect failed"

          echo "--- file counts in /python-env ---"
          docker run --rm --entrypoint='' "diag:docker-1" sh -c "find /python-env -type f | wc -l" 2>&1 || true
          podman run --rm --entrypoint='' "diag:podman-1" sh -c "find /python-env -type f | wc -l" 2>&1 || true

      - name: Extract buildah COPY --from debug trace (podman run #1)
        run: |
          # Pull the debug lines around the COPY --from=build_stage step so we
          # can see what buildah actually does: lookup, mount, copy, commit, etc.
          echo "--- buildah debug around stage handoff ---"
          grep -E "COPY|--from|commit|mount|layer|rootfs|GraphDriver" /tmp/diag_logs/podman_1.log \
            | head -80 || echo "(no matching debug lines)"

      - name: Compare per-step durations
        run: |
          # Logs are timestamped (ts '%.s') so each line is "<epoch_sec> <text>".
          # Derive per-step duration from the delta between successive step headers,
          # regardless of engine. Step-header regex:
          #   Docker/BuildKit: "#N [stage-X Y/Z] desc"   (first appearance of #N)
          #   Podman:          "[N/M] STEP X/Y: desc"
          python3 - <<'PY'
          import re, statistics, pathlib

          # Match: "<ts> <rest>" and extract a canonical step label for each engine.
          DOCKER_STEP = re.compile(r'^(\d+\.\d+)\s+#(\d+)\s+\[([^\]]+)\]\s+(.+)$')
          PODMAN_STEP = re.compile(r'^(\d+\.\d+)\s+\[\d+/\d+\]\s+STEP\s+(\d+)/\d+:\s+(.+)$')
          TS_LINE = re.compile(r'^(\d+\.\d+)\s')

          def parse_log(path, engine):
              lines = pathlib.Path(path).read_text(errors='replace').splitlines()
              seen = set()
              # Ordered list of (label, start_ts). Each step appears once, at first mention.
              steps = []
              for line in lines:
                  if engine == 'docker':
                      m = DOCKER_STEP.match(line)
                      if m:
                          ts, n, stage, desc = m.groups()
                          label = f"#{n} [{stage}] {desc[:60]}"
                          if n not in seen:
                              steps.append((label, float(ts)))
                              seen.add(n)
                  else:  # podman
                      m = PODMAN_STEP.match(line)
                      if m:
                          ts, n, desc = m.groups()
                          label = f"STEP {n}: {desc[:60]}"
                          if n not in seen:
                              steps.append((label, float(ts)))
                              seen.add(n)
              # End timestamp = last line with a timestamp.
              end_ts = None
              for line in reversed(lines):
                  tm = TS_LINE.match(line)
                  if tm:
                      end_ts = float(tm.group(1))
                      break
              # Duration of step k = start_ts(k+1) - start_ts(k); last uses end_ts.
              durs = []
              for i, (label, start) in enumerate(steps):
                  next_start = steps[i + 1][1] if i + 1 < len(steps) else end_ts
                  if next_start is not None:
                      durs.append((label, next_start - start))
              return durs

          runs = {'docker': [], 'podman': []}
          for engine in runs:
              for i in (1, 2, 3):
                  p = f"/tmp/diag_logs/{engine}_{i}.log"
                  if pathlib.Path(p).exists():
                      runs[engine].append(parse_log(p, engine))

          # Report per-engine: median per-step across runs, ranked by median.
          def report(engine):
              engine_runs = runs[engine]
              if not engine_runs:
                  print(f"{engine}: no logs")
                  return 0.0
              # Map step index -> list of (label, duration) across runs.
              max_steps = max(len(r) for r in engine_runs)
              print(f"\n=== {engine} per-step (median across {len(engine_runs)} runs) ===")
              print(f"{'#':<3} {'label':<70} {'median':>8}")
              total = 0.0
              for k in range(max_steps):
                  labels = {r[k][0] for r in engine_runs if k < len(r)}
                  durs = [r[k][1] for r in engine_runs if k < len(r)]
                  if not durs:
                      continue
                  med = statistics.median(durs)
                  total += med
                  label = next(iter(labels))  # expect identical across runs
                  print(f"{k:<3} {label[:70]:<70} {med:7.2f}s")
              print(f"{'':<3} {'TOTAL':<70} {total:7.2f}s")
              return total

          d_tot = report('docker')
          p_tot = report('podman')
          if d_tot and p_tot:
              print(f"\nRatio (podman/docker): {p_tot/d_tot:.2f}x")
          PY

      - name: Upload raw build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-build-logs
          path: /tmp/diag_logs/
          retention-days: 7
