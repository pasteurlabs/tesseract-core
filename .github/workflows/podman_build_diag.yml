name: Podman build diagnostic

# Manual-only diagnostic to compare docker vs podman build performance step by
# step. Not part of PR validation. Produced during investigation of why the
# podman e2e job runs ~2x the docker e2e job wall time.

on:
  pull_request:

  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.14"
          channels: defaults

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tesseract-core
        run: |
          cp production.uv.lock uv.lock
          uv sync --extra dev --frozen

      - name: Set up Podman
        run: |
          systemctl start --user podman.socket
          systemctl status --user podman.socket
          podman --version
          podman info --format 'storage: {{.Store.GraphDriverName}} (native overlay diff: {{index .Store.GraphStatus "Native Overlay Diff"}}) / runtime: {{.Host.OCIRuntime.Name}} / network: {{.Host.NetworkBackend}}'

      - name: Set up Docker info
        run: |
          docker --version
          docker info --format 'storage: {{.Driver}} / runtime: {{.DefaultRuntime}}'

      - name: Generate build context
        run: |
          # Init a sample tesseract, then produce the rendered Dockerfile +
          # context without actually building. Both engines then build this
          # exact context so differences are engine-level, not SDK-level.
          mkdir -p /tmp/diag_src
          uv run --no-sync tesseract init --target-dir /tmp/diag_src --name diag
          # --generate-only prints the build-context path as its last line of
          # output; capture it (stdout + stderr merged for robustness).
          BUILD_DIR=$(uv run --no-sync tesseract build --generate-only /tmp/diag_src 2>&1 | tail -n 1 | xargs)
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "Build context: ${BUILD_DIR}"
          ls -la "${BUILD_DIR}"

      - name: Run docker builds (3x, cold cache)
        run: |
          mkdir -p /tmp/diag_logs
          for i in 1 2 3; do
            echo "--- docker run $i ---"
            docker system prune -af --volumes >/dev/null 2>&1 || true
            start=$(date +%s.%N)
            docker buildx build \
              --no-cache \
              --progress=plain \
              --file "${BUILD_DIR}/Dockerfile" \
              --tag "diag:docker-${i}" \
              "${BUILD_DIR}" \
              > "/tmp/diag_logs/docker_${i}.log" 2>&1 || echo "docker build $i FAILED"
            end=$(date +%s.%N)
            dur=$(echo "$end - $start" | bc)
            echo "docker run ${i}: ${dur}s wall"
          done

      - name: Run podman builds (3x, cold cache)
        env:
          DOCKER_HOST: unix:///run/user/1001/podman/podman.sock
        run: |
          for i in 1 2 3; do
            echo "--- podman run $i ---"
            podman system reset -f >/dev/null 2>&1 || true
            # Restart socket after reset.
            systemctl start --user podman.socket
            start=$(date +%s.%N)
            podman buildx build \
              --no-cache \
              --progress=plain \
              --file "${BUILD_DIR}/Dockerfile" \
              --tag "diag:podman-${i}" \
              "${BUILD_DIR}" \
              > "/tmp/diag_logs/podman_${i}.log" 2>&1 || echo "podman build $i FAILED"
            end=$(date +%s.%N)
            dur=$(echo "$end - $start" | bc)
            echo "podman run ${i}: ${dur}s wall"
          done

      - name: Compare per-step durations
        run: |
          # BuildKit progress=plain emits "#<N> DONE X.Ys" per step; podman's
          # buildx emits a similar form. Group durations by step line prefix
          # (whichever shows up) and print medians side by side.
          python3 - <<'PY'
          import re, statistics, pathlib, collections

          STEP_RE = re.compile(r'^#(\d+)\s+(.*?)DONE\s+([\d.]+)s', re.MULTILINE)
          STEP_HEADER_RE = re.compile(r'^#(\d+)\s+\[([^\]]+)\]\s+(.+?)$', re.MULTILINE)

          def parse_log(path):
              text = pathlib.Path(path).read_text(errors='replace')
              headers = {m.group(1): f"[{m.group(2)}] {m.group(3)}"[:80]
                         for m in STEP_HEADER_RE.finditer(text)}
              durations = {}
              for m in re.finditer(r'^#(\d+)\s+DONE\s+([\d.]+)s', text, re.MULTILINE):
                  n, d = m.group(1), float(m.group(2))
                  durations[n] = d
              return headers, durations

          runs = {'docker': [], 'podman': []}
          for engine in runs:
              for i in (1, 2, 3):
                  p = f"/tmp/diag_logs/{engine}_{i}.log"
                  if pathlib.Path(p).exists():
                      runs[engine].append(parse_log(p))

          # Union of step numbers across all runs.
          all_steps = set()
          for engine_runs in runs.values():
              for headers, durations in engine_runs:
                  all_steps.update(durations.keys())

          print(f"{'step':<6} {'description':<60} {'docker':>10} {'podman':>10} {'ratio':>8}")
          print('-' * 100)
          for step in sorted(all_steps, key=int):
              desc = ''
              for engine_runs in runs.values():
                  for headers, _ in engine_runs:
                      if step in headers:
                          desc = headers[step]
                          break
                  if desc:
                      break
              docker_durs = [d.get(step) for _, d in runs['docker'] if d.get(step) is not None]
              podman_durs = [d.get(step) for _, d in runs['podman'] if d.get(step) is not None]
              docker_med = statistics.median(docker_durs) if docker_durs else None
              podman_med = statistics.median(podman_durs) if podman_durs else None
              ratio = (podman_med / docker_med) if (docker_med and podman_med and docker_med > 0) else None
              print(f"#{step:<5} {desc[:60]:<60} "
                    f"{'' if docker_med is None else f'{docker_med:9.2f}s':>10} "
                    f"{'' if podman_med is None else f'{podman_med:9.2f}s':>10} "
                    f"{'' if ratio is None else f'{ratio:7.2f}x':>8}")

          # Totals.
          def total(engine):
              totals = []
              for _, d in runs[engine]:
                  totals.append(sum(d.values()))
              return totals
          d_tot, p_tot = total('docker'), total('podman')
          if d_tot and p_tot:
              dm, pm = statistics.median(d_tot), statistics.median(p_tot)
              print('-' * 100)
              print(f"{'TOTAL':<6} {'sum of per-step DONE':<60} {dm:9.2f}s  {pm:9.2f}s  {pm/dm:7.2f}x")
          PY

      - name: Upload raw build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-build-logs
          path: /tmp/diag_logs/
          retention-days: 7
