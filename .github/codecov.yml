codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: true
coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 0.1%
        informational: false
        only_pulls: false
    project:
      default:
        informational: true
        only_pulls: false
comment:
  layout: "condensed_header, diff, condensed_files, condensed_footer"
  hide_project_coverage: false
ignore:
  - "tesseract_core/_version.py"
# Some test jobs only run in the merge queue (see .github/scripts/plan_ci.py).
# Every upload is flagged by job, so on pull requests that skip those jobs,
# Codecov carries their coverage forward from the base commit.
flag_management:
  default_rules:
    carryforward: true
