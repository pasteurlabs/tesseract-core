<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 650" font-family="Lexend, Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Internal and external interfaces of a Tesseract.
       Hand-edited; render a preview with `rsvg-convert -w 1200 tesseract-interfaces.svg -o preview.png`. -->

  <style>
    .title    { font-size: 30px; font-weight: 600; fill: #1f2328; }
    .section  { font-size: 21px; font-weight: 500; fill: #1f2328; }
    .code     { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; fill: #1f2328; }
    .pill     { font-size: 17px; font-weight: 500; fill: #1f2328; }
    .caption  { font-size: 13px; letter-spacing: 0.12em; fill: #6b7280; }
    .label    { font-size: 16px; fill: #3d434c; }
    .muted    { font-size: 16px; fill: #4b5563; }
    .actor    { font-size: 17px; font-weight: 500; fill: #1f2328; }
    .badge    { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .wire     { fill: none; stroke: #4b5563; stroke-width: 2; }
    .icon     { fill: #ffffff; stroke: #1f2328; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <!-- Brand gradient, magenta to cyan, as in the logo -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset="1" stop-color="#00d4f0"/>
    </linearGradient>
    <linearGradient id="brand-glyph" gradientUnits="userSpaceOnUse" x1="-18" y1="-18" x2="18" y2="18">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset="1" stop-color="#00d4f0"/>
    </linearGradient>

    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>

    <clipPath id="tesseract-clip">
      <rect x="240" y="20" width="340" height="340" rx="18"/>
    </clipPath>

    <!-- Single person, centered on its own origin -->
    <g id="person" class="icon">
      <circle cx="0" cy="-10" r="9"/>
      <path d="M -16 20 C -16 6 -8 2 0 2 C 8 2 16 6 16 20"/>
    </g>
  </defs>

  <!-- Card background, so the figure stays legible on dark themes -->
  <rect width="600" height="650" rx="16" fill="#ffffff"/>


  <!-- ===== Tesseract ===== -->

  <g clip-path="url(#tesseract-clip)">
    <rect x="240" y="20" width="340" height="340" fill="#ffffff"/>
    <rect x="240" y="82" width="340" height="140" fill="#fff1f8"/>
    <rect x="240" y="222" width="340" height="138" fill="#ebfbfe"/>
  </g>
  <line x1="240" y1="82" x2="580" y2="82" stroke="#e5b8cf" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="240" y1="222" x2="580" y2="222" stroke="#a9dde6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="240" y="20" width="340" height="340" rx="18" fill="none" stroke="url(#brand)" stroke-width="3"/>

  <!-- Header: logo glyph + name -->
  <g transform="translate(334 51)" fill="none" stroke="url(#brand-glyph)" stroke-width="1.4">
    <rect x="-17" y="-17" width="34" height="34" rx="2"/>
    <rect x="-15.5" y="-15.5" width="31" height="31" rx="4" transform="rotate(7.5)"/>
    <rect x="-14" y="-14" width="28" height="28" rx="5" transform="rotate(15)"/>
    <rect x="-12.5" y="-12.5" width="25" height="25" rx="6" transform="rotate(22.5)"/>
    <rect x="-11" y="-11" width="22" height="22" rx="6" transform="rotate(30)"/>
    <rect x="-9.5" y="-9.5" width="19" height="19" rx="6" transform="rotate(37.5)"/>
    <rect x="-8" y="-8" width="16" height="16" rx="5" transform="rotate(45)"/>
  </g>
  <text x="364" y="62" class="title">Tesseract</text>

  <!-- Wrapped function and its API module -->
  <text x="410" y="118" text-anchor="middle" class="section">Wrapped function</text>
  <line x1="410" y1="132" x2="410" y2="164" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
  <rect x="312" y="172" width="196" height="36" rx="8" fill="#ffffff" stroke="#e5b8cf" stroke-width="1.5"/>
  <text x="410" y="196" text-anchor="middle" class="code">tesseract_api.py</text>

  <!-- Runtime and its interfaces -->
  <text x="410" y="258" text-anchor="middle" class="section">Tesseract Runtime</text>
  <text x="410" y="284" text-anchor="middle" class="caption">INTERFACES</text>
  <g>
    <rect x="256" y="298" width="86" height="44" rx="10" fill="#ffffff" stroke="#a9dde6" stroke-width="1.5"/>
    <rect x="352" y="298" width="86" height="44" rx="10" fill="#ffffff" stroke="#a9dde6" stroke-width="1.5"/>
    <rect x="448" y="298" width="116" height="44" rx="10" fill="#ffffff" stroke="#a9dde6" stroke-width="1.5"/>
    <text x="299" y="326" text-anchor="middle" class="pill">HTTP</text>
    <text x="395" y="326" text-anchor="middle" class="pill">CLI</text>
    <text x="506" y="326" text-anchor="middle" class="pill">Python API</text>
  </g>


  <!-- ===== Creator side ===== -->

  <use xlink:href="#person" href="#person" transform="translate(60 452)"/>
  <text x="60" y="500" text-anchor="middle" class="actor">Tesseract</text>
  <text x="60" y="521" text-anchor="middle" class="actor">creator</text>

  <!-- 1: provides tesseract_api.py -->
  <path d="M 60 422 V 204 Q 60 190 74 190 H 304" class="wire" marker-end="url(#head)"/>
  <circle cx="88" cy="168" r="11" fill="#ff1493"/>
  <text x="88" y="172.5" text-anchor="middle" class="badge">1</text>
  <text x="106" y="174" class="label">provides</text>

  <!-- 2: builds / bundles the runtime -->
  <path d="M 60 272 Q 60 258 74 258 H 234" class="wire" marker-end="url(#head)"/>
  <circle cx="88" cy="236" r="11" fill="#ff1493"/>
  <text x="88" y="240.5" text-anchor="middle" class="badge">2</text>
  <text x="106" y="242" class="label">builds / bundles</text>


  <!-- ===== User side ===== -->

  <!-- 3: deployment -->
  <line x1="299" y1="350" x2="299" y2="420" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="395" y1="350" x2="395" y2="420" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="506" y1="350" x2="506" y2="420" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
  <circle cx="186" cy="385" r="11" fill="#00b4d0"/>
  <text x="186" y="389.5" text-anchor="middle" class="badge">3</text>
  <text x="204" y="391" class="label">deployment</text>

  <rect x="240" y="428" width="340" height="80" rx="14" fill="#f5f6f8" stroke="#d6dae0" stroke-width="1.5"/>
  <text x="410" y="462" text-anchor="middle" class="muted">Research notebooks · Workflow engines</text>
  <text x="410" y="486" text-anchor="middle" class="muted">Compute clusters · AD engines</text>

  <!-- 4: use -->
  <line x1="410" y1="516" x2="410" y2="562" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
  <circle cx="436" cy="539" r="11" fill="#00b4d0"/>
  <text x="436" y="543.5" text-anchor="middle" class="badge">4</text>

  <use xlink:href="#person" href="#person" transform="translate(381 596) scale(0.8)"/>
  <use xlink:href="#person" href="#person" transform="translate(439 596) scale(0.8)"/>
  <use xlink:href="#person" href="#person" transform="translate(410 592)"/>
  <text x="410" y="636" text-anchor="middle" class="actor">Tesseract users</text>
</svg>
