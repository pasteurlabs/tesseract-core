[pytest]
# Standalone config for benchmarks — overrides the root pyproject.toml so that
# `pytest benchmarks/` doesn't pull in typeguard, coverage, or test-suite paths.
#
# The time budget per benchmark is short because CI runs the suite several
# times per side (see .github/workflows/benchmarks.yml), and repeating a fresh
# pass reduces noise more than adding rounds within one pass.
addopts =
    --benchmark-disable-gc
    --benchmark-warmup=on
    --benchmark-min-rounds=5
    --benchmark-max-time=0.5
    --benchmark-time-unit=ms
    --benchmark-group-by=func
    --benchmark-columns=min,max,mean,stddev,median,rounds
